# Download page — deploys site/ to GitHub Pages.
#
# The page asks the GitHub releases API for the latest release in the visitor's
# browser, so it never needs redeploying when a release goes out; this runs only
# when the page itself changes. One-time setup: Settings → Pages → Source must
# be "GitHub Actions", or the first run fails.

name: Download page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
