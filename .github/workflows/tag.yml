# Tag on version bump — "bump the version, get a release", without the
# fragility of building on every push. The tag stays the deterministic trigger
# for release.yml; this only creates it when package.json says a new version has
# landed on main. Idempotent: if the tag already exists it does nothing.
#
# One wrinkle worth knowing: GitHub deliberately does not start new workflow
# runs from events created with the default GITHUB_TOKEN. So the tag push below
# will NOT kick off release.yml unless RELEASE_TOKEN (a PAT with contents:write)
# is configured. Without it the tag is still created correctly — you just have
# to run Release by hand against it.

name: Tag on version bump

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push the tag as a real user if a PAT is available, so that the tag
          # event reaches release.yml. Falls back to GITHUB_TOKEN, which still
          # creates the tag but cannot trigger anything.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create the tag if it does not exist
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists — nothing to do."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${tag}" -m "Mindex ${version}"
          git push origin "${tag}"

          if [ -n "${RELEASE_TOKEN}" ]; then
            echo "Pushed ${tag}; the release workflow takes it from here."
          else
            echo "Pushed ${tag}."
            echo "::warning::RELEASE_TOKEN is not set, so this tag will not start the Release workflow. Run it manually against ${tag}."
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
